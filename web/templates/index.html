{{define "content"}}
<h2>Liste des Artistes</h2>
<div class="cards-grid" style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px;">
    {{range .}}
    <div class="card" style="background: #1e1e1e; border-radius: 8px; overflow: hidden; padding: 15px; text-align: center;">
        <img src="{{.Image}}" alt="{{.Name}}" style="width: 100%; height: 200px; object-fit: cover; border-radius: 4px;">
        <h3>{{.Name}}</h3>
        <p>Création : {{.CreationDate}}</p>
        <a href="/artist?id={{.ID}}" style="color: #ff5722; text-decoration: none; font-weight: bold;">Voir les détails</a>
    </div>
    {{end}}
</div>
{{end}}
